name: Config problem
description: Report a configuration issue
title: "[CONFIG] "
labels: ["config-problem"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: A clear description of the configuration issue
    validations:
      required: true
  - type: input
    id: config
    attributes:
      label: Your configuration
      description: Paste your configuration.yaml or UI config (redact secrets)
    validations:
      required: true
